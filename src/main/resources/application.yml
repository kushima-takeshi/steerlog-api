spring:
  application:
    name: steerlog-api

  datasource:
    url: jdbc:postgresql://localhost:5432/steerlog
    username: steerlog
    password: steerlog
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

steerlog:
  security:
    jwt:
      # 開発用デフォルト。本番では STEERLOG_JWT_SECRET で上書きする（32文字以上推奨）
      secret: ${STEERLOG_JWT_SECRET:change-me-to-a-long-random-secret-key-32bytes}
      expiration-ms: 86400000

logging:
  level:
    org.flywaydb: INFO
